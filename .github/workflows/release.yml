# Builds the files of a release, and publishes them only from a tag.
#
# A run started by hand builds every file and computes every checksum, and it
# publishes nothing. That is the way to test this file without a release.
#
# The files of a release:
#
# - hartwood-<version>-<target>[.exe]: the command line, one binary for each
#   of five targets.
# - hartwood-web-<version>.tar.gz: the web frontend as a static site, with
#   no boot images. The pages workflow adds the images.
# - SHA256SUMS.
#
# Every action is pinned to the commit of a release, for the reason that
# ci.yml gives.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: hartwood for ${{ matrix.target }}
    strategy:
      # A release that lacks one host is not a release.
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - name: install the C compiler of musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked -p hartwood-cli --target ${{ matrix.target }}
      - name: collect
        shell: bash
        run: |
          mkdir out
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/hartwood${suffix}" "out/hartwood-${{ matrix.target }}${suffix}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  web:
    name: the web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install wasm-pack
        run: |
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack
      - name: build
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build
          tar -czf ../hartwood-web.tar.gz -C dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: hartwood-web.tar.gz
          if-no-files-found: error

  checksums:
    name: name the files and hash them
    needs: [cli, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # For `cargo metadata`, which reads the version the way Cargo does.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.100.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: built/
          merge-multiple: true
      # One machine hashes every file, so every checksum comes from the same
      # tool.
      - name: name and hash
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "hartwood-cli") | .version')
          mkdir dist
          for file in built/*; do
            name=$(basename "$file")
            case "$name" in
              hartwood-web.tar.gz) cp "$file" "dist/hartwood-web-${version}.tar.gz" ;;
              hartwood-*) cp "$file" "dist/hartwood-${version}-${name#hartwood-}" ;;
              *) echo "an unknown file: $name" >&2; exit 1 ;;
            esac
          done
          cd dist
          sha256sum hartwood-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" = 6
          echo "${version}" > ../VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            VERSION
          if-no-files-found: error

  release:
    name: publish a draft release
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .
      # A tag that disagrees with the version in Cargo.toml gives a binary
      # whose --version names a release it does not belong to.
      - name: check that the tag names the version
        shell: bash
        run: |
          version=$(cat VERSION)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME} and Cargo.toml says ${version}." >&2
            exit 1
          fi
      # The notes are the part of CHANGELOG.md for this version.
      - name: write the notes
        shell: bash
        run: |
          version=$(cat VERSION)
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hartwood-*
      # A draft, so that a person reads the assets before anybody else can
      # download them.
      - name: open the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "hartwood ${GITHUB_REF_NAME}" \
            --notes-file notes.md
