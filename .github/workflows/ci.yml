# Every action is pinned to the commit of a release, and not to a tag.
# A tag moves.
#
# dtolnay/rust-toolchain usually reads the toolchain from the name of the ref,
# as in `@stable`. A pinned commit has no such name, so the toolchain is
# named in `with`. It is the version in rust-toolchain.toml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.100.0
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: check on ${{ matrix.os }}
    strategy:
      # One host that fails must not hide the state of the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Clippy compiles the tests as well, so it reports what rustc reports.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The core must build for the browser. A use of the file system, a thread
  # or the clock in the core breaks this job, and not the page at run time.
  wasm:
    name: build the core for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.100.0
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p hartwood-core --target wasm32-unknown-unknown --locked -- -D warnings

  # The oracle. The job builds the riscv-tests programs at the commit that
  # the script names, and runs each suite that a finished milestone covers.
  riscv-tests:
    name: riscv-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install a RISC-V compiler for bare metal
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      - run: scripts/build-riscv-tests.sh
      - name: run the suites
        run: cargo run --release --locked -p hartwood-testsuite -- rv64ui- rv64um- rv64ua- rv64uc- rv64uf- rv64ud- rv64mi-p- rv64si-p-

  # The web frontend: the WASM package, the type check and the bundle.
  web:
    name: build the web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install wasm-pack
        run: |
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack
      - name: build
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build
