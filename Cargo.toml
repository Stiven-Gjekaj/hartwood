[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Stiven-Gjekaj/hartwood"
authors = ["Stiven Gjekaj <stivenagostingjekaj@gmail.com>"]

# Each version is exact. A new version of a dependency is a commit of its own,
# so a change in behaviour has one place to look.
[workspace.dependencies]
hartwood-core = { path = "crates/core" }
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` and not `forbid`: a crate that needs unsafe code allows it for one
# item, with the reason next to it. `forbid` refuses that.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1

# The tests run whole programs on the emulator. A debug build runs them about
# twenty times slower, so the tests compile the emulator with optimisation.
[profile.test]
opt-level = 3
